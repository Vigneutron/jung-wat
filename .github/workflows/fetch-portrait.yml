# One-off: fetch a public-domain portrait of C. G. Jung from Wikimedia Commons
# (the sandbox cannot reach it), shrink it for embedding, commit it to assets/.
name: Fetch Jung portrait
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download and prepare
        run: |
          set -euo pipefail
          urls=(
            "https://commons.wikimedia.org/wiki/Special:FilePath/Jung%201910-rotated.jpg"
            "https://commons.wikimedia.org/wiki/Special:FilePath/Carl%20Gustav%20Jung%20(1912).png"
            "https://commons.wikimedia.org/wiki/Special:FilePath/CGJung.jpg"
          )
          ok=""
          for u in "${urls[@]}"; do
            echo "trying $u"
            if curl -sfL --max-time 60 -o raw.img "$u" && file raw.img | grep -qiE 'image|bitmap'; then ok="$u"; break; fi
            echo "  no"
          done
          if [ -z "$ok" ]; then echo "::error::no candidate URL worked"; exit 1; fi
          echo "downloaded: $ok"
          file raw.img
          pip install -q pillow
          mkdir -p assets
          python3 - <<'PY'
          from PIL import Image
          im = Image.open('raw.img').convert('L')
          im.thumbnail((900, 900))
          im.save('assets/jung.jpg', 'JPEG', quality=62, optimize=True)
          import os
          print('saved', im.size, os.path.getsize('assets/jung.jpg'), 'bytes')
          PY
          echo "$ok" > assets/jung-source.txt
          ls -la assets/
      - name: Commit
        run: |
          git config user.name deploy
          git config user.email deploy@users.noreply.github.com
          git add assets
          git commit -m "Add public-domain Jung portrait (source URL in assets/jung-source.txt)"
          git push
